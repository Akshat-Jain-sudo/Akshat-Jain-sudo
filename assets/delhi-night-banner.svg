<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient: Delhi Midnight Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="85%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1f182c"/>
    </linearGradient>

    <!-- Warm Amber Skyline Glow -->
    <radialGradient id="cityGlow" cx="68%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c1222" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Chai Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <style>
      .star-twinkle-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-twinkle-2 { animation: twinkle 4s ease-in-out infinite 1.5s; }
      .star-twinkle-3 { animation: twinkle 2.5s ease-in-out infinite 0.7s; }
      .cursor-blink { animation: blink 1s step-end infinite; }
      .steam-rise-1 { animation: steamRise 2.8s ease-out infinite; }
      .steam-rise-2 { animation: steamRise 2.8s ease-out infinite 1.4s; }
      .lamp-flicker { animation: lampPulse 5s ease-in-out infinite; }
      .cat-tail { animation: tailWag 3.5s ease-in-out infinite; transform-origin: 778px 212px; }

      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 0.95; transform: scale(1.3); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(0) scaleX(0.8); }
        35% { opacity: 0.6; }
        100% { opacity: 0; transform: translateY(-16px) scaleX(1.3); }
      }
      @keyframes lampPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.65; }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(10deg); }
      }
    </style>
  </defs>

  <!-- Sky Canvas -->
  <rect width="850" height="260" rx="12" fill="url(#skyGrad)"/>
  <rect width="850" height="260" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- City Atmosphere Warmth -->
  <rect width="850" height="260" rx="12" fill="url(#cityGlow)"/>

  <!-- Twinkling Stars -->
  <g fill="#fef3c7">
    <circle cx="120" cy="38" r="1.2" class="star-twinkle-1"/>
    <circle cx="210" cy="55" r="1.5" class="star-twinkle-3"/>
    <circle cx="340" cy="30" r="1.2" class="star-twinkle-2"/>
    <circle cx="480" cy="45" r="1.5" class="star-twinkle-1"/>
    <circle cx="560" cy="25" r="1" class="star-twinkle-3"/>
    <circle cx="640" cy="50" r="1.5" class="star-twinkle-2"/>
    <circle cx="790" cy="35" r="1.2" class="star-twinkle-1"/>
    <circle cx="430" cy="70" r="1" class="star-twinkle-2"/>
    <circle cx="270" cy="85" r="1.2" class="star-twinkle-3"/>
  </g>

  <!-- Delhi Crescent Moon -->
  <g transform="translate(740, 28)">
    <circle cx="16" cy="16" r="22" fill="url(#moonGlow)"/>
    <path d="M 22 2 A 16 16 0 1 0 22 30 A 13 13 0 1 1 22 2 Z" fill="#fef3c7"/>
  </g>

  <!-- Distant Delhi Skyline Silhouettes -->
  <g fill="#0b1120" opacity="0.85">
    <!-- Buildings Background -->
    <rect x="420" y="145" width="28" height="60" rx="1"/>
    <rect x="455" y="130" width="35" height="75" rx="1"/>
    <rect x="495" y="150" width="24" height="55" rx="1"/>
    <rect x="525" y="120" width="40" height="85" rx="1"/>
    <rect x="680" y="135" width="38" height="70" rx="1"/>
    <rect x="725" y="145" width="30" height="60" rx="1"/>
    <rect x="760" y="125" width="45" height="80" rx="1"/>
    <rect x="810" y="140" width="35" height="65" rx="1"/>

    <!-- Radio Tower & Red Beacon -->
    <line x1="545" y1="120" x2="545" y2="92" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="545" cy="92" r="2" fill="#ef4444" class="star-twinkle-1"/>
    <line x1="782" y1="125" x2="782" y2="105" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="782" cy="105" r="1.8" fill="#ef4444" class="star-twinkle-2"/>
  </g>

  <!-- Prominent India Gate Silhouette -->
  <g fill="#0f172a">
    <!-- Base plinth -->
    <rect x="585" y="162" width="76" height="43"/>
    <rect x="582" y="160" width="82" height="4"/>
    <!-- Vertical Pillars -->
    <rect x="588" y="112" width="20" height="50"/>
    <rect x="638" y="112" width="20" height="50"/>
    <!-- Central Arch Cutout (Sky colored) -->
    <path d="M 608 162 L 608 126 C 608 116, 638 116, 638 126 L 638 162 Z" fill="#141a2e"/>
    <!-- Arch Entablature & Cornice -->
    <rect x="584" y="106" width="78" height="6"/>
    <rect x="587" y="96" width="72" height="10"/>
    <rect x="591" y="90" width="64" height="6"/>
    <rect x="596" y="86" width="54" height="4"/>
    <!-- Dome Top (Chhatri silhouette) -->
    <path d="M 618 86 C 618 82, 628 82, 628 86 Z" fill="#0f172a"/>

    <!-- Subtle Golden Architectural Illumination -->
    <ellipse cx="623" cy="162" rx="18" ry="6" fill="#f59e0b" opacity="0.3"/>
    <rect x="590" y="115" width="2" height="42" fill="#fbbf24" opacity="0.15"/>
    <rect x="654" y="115" width="2" height="42" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Distant Building Window Lights (Pixel-Art Grid) -->
  <g fill="#fbbf24" opacity="0.6">
    <rect x="462" y="138" width="3" height="4"/>
    <rect x="472" y="138" width="3" height="4"/>
    <rect x="462" y="148" width="3" height="4"/>
    <rect x="480" y="158" width="3" height="4"/>
    <rect x="532" y="130" width="3" height="4"/>
    <rect x="542" y="130" width="3" height="4"/>
    <rect x="552" y="142" width="3" height="4"/>
    <rect x="532" y="154" width="3" height="4"/>
    <rect x="690" y="145" width="3" height="4"/>
    <rect x="700" y="155" width="3" height="4"/>
    <rect x="732" y="155" width="3" height="4"/>
    <rect x="770" y="135" width="3" height="4"/>
    <rect x="785" y="145" width="3" height="4"/>
    <rect x="770" y="160" width="3" height="4"/>
  </g>

  <!-- Foreground: Cozy Rooftop Balcony -->
  <!-- Parapet / Railing -->
  <rect x="0" y="200" width="850" height="60" fill="#090d16"/>
  <rect x="0" y="196" width="850" height="5" fill="#131c2e"/>
  <!-- Railing Posts & Horizontal Bars -->
  <line x1="0" y1="198" x2="850" y2="198" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="210" x2="850" y2="210" stroke="#131c2e" stroke-width="1.5"/>

  <!-- Rooftop String Lights / Warm Fairy Bulbs -->
  <g>
    <path d="M 380 185 Q 480 196 580 188 Q 680 196 780 186" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,3"/>
    <!-- Fairy Bulbs -->
    <circle cx="400" cy="188" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="445" cy="192" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="490" cy="193" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="535" cy="191" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="610" cy="191" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="660" cy="193" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="710" cy="191" r="2.5" fill="#fde68a" class="lamp-flicker"/>
    <circle cx="755" cy="188" r="2.5" fill="#fde68a" class="lamp-flicker"/>
  </g>

  <!-- Left Side: Terminal Typography Branding -->
  <g transform="translate(42, 38)">
    <!-- Location Pill -->
    <rect x="0" y="0" width="198" height="24" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
    <circle cx="12" cy="12" r="7" fill="#38bdf8" fill-opacity="0.25" class="star-twinkle-1"/>
    <text x="24" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">DELHI NIGHT // 28.61° N</text>

    <!-- Main Title: AKSHAT JAIN -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Syne', sans-serif" font-size="36" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      AKSHAT JAIN
    </text>

    <!-- Subtitle: DTU IT -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#38bdf8" letter-spacing="0.2">
      IT Student @ Delhi Technological University
    </text>

    <!-- Core Stack Badges Line -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#cbd5e1">
      <tspan fill="#f59e0b">C++</tspan> · <tspan fill="#38bdf8">Python</tspan> · <tspan fill="#a78bfa">SQL</tspan> · <tspan fill="#cbd5e1">Backend</tspan> · <tspan fill="#34d399">Machine Learning</tspan>
    </text>

    <!-- Tagline with Blinking Cursor -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="370" height="25" rx="5" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
        &gt; building things, breaking things, fixing things<tspan fill="#38bdf8" class="cursor-blink"> _</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side Foreground Rooftop Elements: Desk, Laptop, Books, Steaming Chai, Pixel Cat -->
  <g transform="translate(670, 172)">
    <!-- Wooden Work Table Surface -->
    <rect x="-30" y="28" width="180" height="8" rx="2" fill="#33241b"/>
    <rect x="-32" y="26" width="184" height="3" fill="#4a3528"/>

    <!-- Desk Lamp -->
    <path d="M 125 26 L 115 2 L 105 8" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M 98 6 L 112 11 L 105 18 Z" fill="#f59e0b"/>
    <!-- Warm Desk Light Cone -->
    <polygon points="102,17 70,28 128,28" fill="#fde68a" fill-opacity="0.2" class="lamp-flicker"/>

    <!-- Stack of Engineering / DSA Textbooks -->
    <rect x="-20" y="20" width="32" height="6" rx="1" fill="#1e3a5f"/>
    <rect x="-18" y="14" width="29" height="6" rx="1" fill="#7c2d12"/>
    <rect x="-21" y="8" width="33" height="6" rx="1" fill="#065f46"/>
    <line x1="-19" y1="11" x2="10" y2="11" stroke="#fef3c7" stroke-width="0.8" opacity="0.6"/>

    <!-- Steaming Clay Kulhad / Chai Cup -->
    <g transform="translate(18, 12)">
      <!-- Cup Body -->
      <path d="M 0 4 L 2 15 Q 6 16 10 15 L 12 4 Z" fill="#b45309"/>
      <path d="M 2 4 Q 6 5 10 4 Q 6 3 2 4 Z" fill="#78350f"/>
      <!-- Hot Chai Glow -->
      <ellipse cx="6" cy="4" rx="4" ry="1.2" fill="#d97706"/>
      <!-- Animated Steam Wisps -->
      <path d="M 4 2 Q 2 -4 5 -8" fill="none" stroke="url(#steamGrad)" stroke-width="1.2" stroke-linecap="round" class="steam-rise-1"/>
      <path d="M 8 1 Q 10 -5 7 -10" fill="none" stroke="url(#steamGrad)" stroke-width="1.2" stroke-linecap="round" class="steam-rise-2"/>
    </g>

    <!-- Laptop with Glowing Screen -->
    <g transform="translate(42, 6)">
      <!-- Screen Glow Aura on desk -->
      <ellipse cx="20" cy="22" rx="28" ry="8" fill="#38bdf8" fill-opacity="0.22"/>

      <!-- Laptop Base -->
      <polygon points="0,22 40,22 36,25 4,25" fill="#475569"/>
      <!-- Laptop Screen Backing -->
      <polygon points="6,3 34,3 37,22 3,22" fill="#0f172a"/>
      <!-- Screen Inner Glow (Code editor) -->
      <polygon points="7,4 33,4 35,21 5,21" fill="#0369a1"/>
      <!-- Code Lines on Screen (Pixel Art) -->
      <line x1="8" y1="7" x2="20" y2="7" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="10" y1="10" x2="28" y2="10" stroke="#fde68a" stroke-width="1.2"/>
      <line x1="10" y1="13" x2="22" y2="13" stroke="#a78bfa" stroke-width="1.2"/>
      <line x1="8" y1="16" x2="16" y2="16" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="28" cy="16" r="1" fill="#f43f5e" class="star-twinkle-3"/>
    </g>

    <!-- Cozy Sleeping Pixel Cat beside Laptop -->
    <g transform="translate(98, 14)">
      <!-- Cat Body (Curled) -->
      <ellipse cx="14" cy="11" rx="10" ry="7" fill="#f97316"/>
      <!-- Stripes -->
      <path d="M 12 5 Q 14 7 12 9" fill="none" stroke="#c2410c" stroke-width="1"/>
      <path d="M 16 5 Q 18 7 16 9" fill="none" stroke="#c2410c" stroke-width="1"/>
      <!-- Cat Head -->
      <circle cx="6" cy="10" r="5" fill="#f97316"/>
      <!-- Ears -->
      <polygon points="3,6 5,2 7,6" fill="#ea580c"/>
      <polygon points="7,6 9,2 11,6" fill="#ea580c"/>
      <!-- Sleeping Eyes ^ ^ -->
      <path d="M 4 10 Q 5 9 6 10" fill="none" stroke="#431407" stroke-width="0.8"/>
      <!-- Animated Tail -->
      <path d="M 23 13 Q 28 15 27 10" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" class="cat-tail"/>
      <!-- Tiny 'z' floating -->
      <text x="18" y="2" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fde68a" font-weight="bold" class="star-twinkle-2">z</text>
      <text x="23" y="-4" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#fde68a" font-weight="bold" class="star-twinkle-1">z</text>
    </g>
  </g>
</svg>
