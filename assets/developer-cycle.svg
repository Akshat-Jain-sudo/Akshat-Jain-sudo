<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 50" width="100%" height="50" fill="none">
  <defs>
    <style>
      .step-1 { animation: cycle1 6s ease-in-out infinite; }
      .step-2 { animation: cycle2 6s ease-in-out infinite; }
      .step-3 { animation: cycle3 6s ease-in-out infinite; }
      .step-4 { animation: cycle4 6s ease-in-out infinite; }
      .step-5 { animation: cycle5 6s ease-in-out infinite; }
      .arrow-flow { animation: arrowFlow 1.8s ease-in-out infinite alternate; }

      @keyframes cycle1 {
        0%, 15% { opacity: 1; filter: drop-shadow(0 0 6px rgba(254, 240, 138, 0.4)); }
        20%, 100% { opacity: 0.45; filter: none; }
      }
      @keyframes cycle2 {
        0%, 15% { opacity: 0.45; filter: none; }
        20%, 35% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
        40%, 100% { opacity: 0.45; filter: none; }
      }
      @keyframes cycle3 {
        0%, 35% { opacity: 0.45; filter: none; }
        40%, 55% { opacity: 1; filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.4)); }
        60%, 100% { opacity: 0.45; filter: none; }
      }
      @keyframes cycle4 {
        0%, 55% { opacity: 0.45; filter: none; }
        60%, 75% { opacity: 1; filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
        80%, 100% { opacity: 0.45; filter: none; }
      }
      @keyframes cycle5 {
        0%, 75% { opacity: 0.45; filter: none; }
        80%, 95% { opacity: 1; filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.4)); }
        100% { opacity: 0.45; filter: none; }
      }
      @keyframes arrowFlow {
        from { opacity: 0.3; }
        to { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="680" height="50" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

  <!-- Step 1: Idea (x: 25..120) -->
  <g class="step-1">
    <rect x="25" y="10" width="95" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="39" y="30" font-size="14">💡</text>
    <text x="61" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#fef08a">Idea</text>
  </g>

  <!-- Arrow 1 -->
  <text x="132" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 2: Code (x: 155..253) -->
  <g class="step-2">
    <rect x="155" y="10" width="98" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="169" y="30" font-size="14">💻</text>
    <text x="191" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">Code</text>
  </g>

  <!-- Arrow 2 -->
  <text x="265" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 3: Bug (x: 288..380) -->
  <g class="step-3">
    <rect x="288" y="10" width="92" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="302" y="30" font-size="14">🐛</text>
    <text x="324" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">Bug</text>
  </g>

  <!-- Arrow 3 -->
  <text x="392" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 4: Chai (x: 415..511) -->
  <g class="step-4">
    <rect x="415" y="10" width="96" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="429" y="30" font-size="14">☕</text>
    <text x="451" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f59e0b">Chai</text>
  </g>

  <!-- Arrow 4 -->
  <text x="523" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 5: Repeat (x: 546..654) -->
  <g class="step-5">
    <rect x="546" y="10" width="108" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="560" y="30" font-size="14">🚀</text>
    <text x="582" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">Repeat</text>
  </g>
</svg>
