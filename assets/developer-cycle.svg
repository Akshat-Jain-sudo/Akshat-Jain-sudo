<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 50" width="100%" height="50" fill="none">
  <defs>
    <style>
      .step-1 { animation: pulse1 6s infinite; }
      .step-2 { animation: pulse2 6s infinite; }
      .step-3 { animation: pulse3 6s infinite; }
      .step-4 { animation: pulse4 6s infinite; }
      .step-5 { animation: pulse5 6s infinite; }
      .arrow-flow { animation: arrowFlow 1.5s ease-in-out infinite alternate; }

      @keyframes pulse1 {
        0%, 15% { opacity: 1; transform: scale(1.05); }
        20%, 100% { opacity: 0.55; transform: scale(1); }
      }
      @keyframes pulse2 {
        0%, 15% { opacity: 0.55; transform: scale(1); }
        20%, 35% { opacity: 1; transform: scale(1.05); }
        40%, 100% { opacity: 0.55; transform: scale(1); }
      }
      @keyframes pulse3 {
        0%, 35% { opacity: 0.55; transform: scale(1); }
        40%, 55% { opacity: 1; transform: scale(1.05); }
        60%, 100% { opacity: 0.55; transform: scale(1); }
      }
      @keyframes pulse4 {
        0%, 55% { opacity: 0.55; transform: scale(1); }
        60%, 75% { opacity: 1; transform: scale(1.05); }
        80%, 100% { opacity: 0.55; transform: scale(1); }
      }
      @keyframes pulse5 {
        0%, 75% { opacity: 0.55; transform: scale(1); }
        80%, 95% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.55; transform: scale(1); }
      }
      @keyframes arrowFlow {
        from { opacity: 0.35; }
        to { opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="680" height="50" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

  <!-- Step 1: Idea -->
  <g class="step-1" transform="translate(25, 0)">
    <rect x="0" y="10" width="95" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="30" font-size="14">💡</text>
    <text x="36" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#fef08a">Idea</text>
  </g>

  <!-- Arrow 1 -->
  <text x="132" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 2: Code -->
  <g class="step-2" transform="translate(155, 0)">
    <rect x="0" y="10" width="98" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="30" font-size="14">💻</text>
    <text x="36" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">Code</text>
  </g>

  <!-- Arrow 2 -->
  <text x="265" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 3: Bug -->
  <g class="step-3" transform="translate(288, 0)">
    <rect x="0" y="10" width="92" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="30" font-size="14">🐛</text>
    <text x="36" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">Bug</text>
  </g>

  <!-- Arrow 3 -->
  <text x="392" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 4: Chai -->
  <g class="step-4" transform="translate(415, 0)">
    <rect x="0" y="10" width="96" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="30" font-size="14">☕</text>
    <text x="36" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f59e0b">Chai</text>
  </g>

  <!-- Arrow 4 -->
  <text x="523" y="30" font-family="monospace" font-size="14" fill="#64748b" class="arrow-flow">→</text>

  <!-- Step 5: Repeat -->
  <g class="step-5" transform="translate(546, 0)">
    <rect x="0" y="10" width="108" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="30" font-size="14">🚀</text>
    <text x="36" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">Repeat</text>
  </g>
</svg>
